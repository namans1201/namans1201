name: Profile Stats

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate contribution cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/profile_stats.py --username "$PROFILE_USER"
      - name: Save refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh profile contribution statistics"
          git pull --rebase origin main
          git push origin HEAD:main
