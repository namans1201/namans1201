# ═══════════════════════════════════════════════════════════════════════════
# Contribution Snake - monochrome, to match the page.
#
# Two variants, because the README serves them through <picture>:
#   snake-light.svg   black snake, grey dots   (light mode)
#   snake-dark.svg    white snake, grey dots   (dark mode)
#
# ONE-TIME SETUP - the snake 404s until this is done:
#   Settings -> Actions -> General -> Workflow permissions
#     -> "Read and write permissions" -> Save
#   Then: Actions tab -> "Contribution Snake" -> Run workflow
#
# github_user_name uses the repository owner, so this file needs no edit.
# ═══════════════════════════════════════════════════════════════════════════

name: Contribution Snake

on:
  schedule:
    # Offset from the hour: GitHub throttles crons scheduled exactly on it.
    - cron: "41 3,15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#000000&color_dots=#EBEBEB,#C6C6C6,#8F8F8F,#575757,#1A1A1A
            dist/snake-dark.svg?color_snake=#FFFFFF&color_dots=#1A1A1A,#575757,#8F8F8F,#C6C6C6,#EBEBEB

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
